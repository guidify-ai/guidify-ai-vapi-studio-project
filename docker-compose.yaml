# Local stack: Postgres + Nest app.
# Optional: VAPI_STUDIO_CONTEXT=../vapi-studio for a sibling framework spoof.
# Public builds can install @guidify-ai/vapi-studio@0.1.0 from npm in the Dockerfile.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        vapi-studio: ${VAPI_STUDIO_CONTEXT:-../vapi-studio}
    ports:
      - "${PORT:-9999}:${PORT:-9999}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      PORT: ${PORT:-9999}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${PORT:-9999}}
      PROJECT_NAME: ${PROJECT_NAME:-Vapi Studio Project}
      PROJECT_SLUG: ${PROJECT_SLUG:-vapi-studio-project}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      FORCE_COLOR: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONFIG_DIR: /app/config
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
