# Framework stub — promoted to docker-compose.yaml on first yarn start.
# The promoted file is gitignored: edit it for extra local services if needed.
# See docs/guides/extending-events.md

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        # Local spoof: point at a sibling framework checkout. Public builds can
        # instead use npm @guidify-ai/vapi-studio@0.1.0 (see Dockerfile.npm).
        vapi-studio: ${VAPI_STUDIO_CONTEXT:-../vapi-studio}
    ports:
      - "9999:9999"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      PORT: 9999
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9999}
      PROJECT_UUID: ${PROJECT_UUID:-28cd87c2-f4f7-4588-b8fc-cbc91a9ff309}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      FORCE_COLOR: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONFIG_DIR: /app/config
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
